<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>新分頁</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", Roboto, sans-serif;
        background: #f6f5f4;
        color: #1d1d1f;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1d1d1f; color: #f5f5f7; }
      }
      main { display: flex; flex-direction: column; align-items: center; width: min(560px, 90vw); }
      h1 { font-size: 15px; font-weight: 500; margin: 0 0 18px; letter-spacing: 0.02em; }
      form {
        display: flex; align-items: center; width: 100%;
        height: 40px; border-radius: 20px;
        background: #ecebe9; border: 1px solid rgba(29, 29, 31, 0.1);
      }
      @media (prefers-color-scheme: dark) {
        form { background: #1d1d1f; border-color: rgba(245, 245, 247, 0.12); }
      }
      form:focus-within { border-color: #0a7fa8; }
      @media (prefers-color-scheme: dark) { form:focus-within { border-color: #4fb3d9; } }
      form svg { flex: none; margin: 0 10px 0 14px; }
      input {
        flex: 1; min-width: 0; height: 100%;
        border: none; background: none; outline: none;
        font: inherit; font-size: 14px; color: inherit;
      }
      button[type="submit"] {
        flex: none; margin: 0 6px 0 4px; height: 28px; padding: 0 14px;
        border: none; border-radius: 14px; cursor: pointer;
        background: #0a7fa8; color: #fff; font: inherit; font-size: 13px;
      }
      @media (prefers-color-scheme: dark) { button[type="submit"] { background: #4fb3d9; color: #10333f; } }
      .tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin-top: 22px; width: 100%; }
      .tiles button {
        display: flex; flex-direction: column; align-items: center; gap: 6px;
        width: 88px; padding: 10px 4px;
        border: none; border-radius: 10px; background: none; cursor: pointer;
        font: inherit; font-size: 11px; color: inherit;
      }
      @media (prefers-color-scheme: dark) { .tiles button { color: #98989d; } }
      .tiles button:hover { background: rgba(29, 29, 31, 0.06); }
      @media (prefers-color-scheme: dark) { .tiles button:hover { background: rgba(245, 245, 247, 0.08); } }
      .tiles .name { max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .fav img { width: 100%; height: 100%; object-fit: contain; border-radius: 6px; }
      .fav {
        width: 32px; height: 32px; border-radius: 8px;
        display: inline-grid; place-items: center;
        font-weight: 600; font-size: 14px; user-select: none;
        background: hsl(var(--h) 32% 88%); color: hsl(var(--h) 45% 28%);
      }
      @media (prefers-color-scheme: dark) {
        .fav { background: hsl(var(--h) 24% 22%); color: hsl(var(--h) 34% 76%); }
      }
      .hint { margin: 26px 0 0; opacity: 0.55; font-size: 12px; }
      .hint[hidden] { display: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Surf</h1>
      <form id="search">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.55" aria-hidden="true">
          <path d="M11 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0zM10.5 10.5 13 13" />
        </svg>
        <input id="q" type="text" placeholder="搜尋或輸入網址" aria-label="搜尋或輸入網址" autocomplete="off" spellcheck="false" />
        <button type="submit">搜尋</button>
      </form>
      <div class="tiles" id="tiles" hidden></div>
      <p class="hint" id="hint">在上方輸入，或直接在這裡搜尋</p>
    </main>
    <script>
      // The content bridge is injected per tab; the NTP talks through the
      // same token-bound channel as every content script. Tiles come from
      // real history rows, never invented ones.
      var hash = function (s) {
        var h = 0;
        for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
        return h;
      };
      document.getElementById("search").addEventListener("submit", function (e) {
        e.preventDefault();
        var q = document.getElementById("q").value.trim();
        if (q && window.__surf) window.__surf.send("ntp://search", { q: q });
      });
      window.__surfOnEvent = function (name, payload) {
        if (name !== "ntp://sites" || !payload || !payload.sites || !payload.sites.length) return;
        var tiles = document.getElementById("tiles");
        document.getElementById("hint").hidden = true;
        tiles.hidden = false;
        tiles.textContent = "";
        payload.sites.forEach(function (s) {
          var b = document.createElement("button");
          b.type = "button";
          b.title = s.url;
          var f = document.createElement("span");
          f.className = "fav";
          f.style.setProperty("--h", hash(s.host));
          f.textContent = (s.host.match(/[a-z0-9]/i) || ["?"])[0].toUpperCase();
          if (s.favicon) {
            var img = document.createElement("img");
            img.src = s.favicon;
            img.alt = "";
            img.onerror = function () { img.remove(); };
            f.textContent = "";
            f.appendChild(img);
          }
          var n = document.createElement("span");
          n.className = "name";
          n.textContent = s.title;
          b.appendChild(f);
          b.appendChild(n);
          b.addEventListener("click", function () {
            if (window.__surf) window.__surf.send("ntp://search", { q: s.url });
          });
          tiles.appendChild(b);
        });
      };
      if (window.__surf) window.__surf.send("ntp://ready", null);
      else
        window.addEventListener("DOMContentLoaded", function () {
          if (window.__surf) window.__surf.send("ntp://ready", null);
        });
    </script>
  </body>
</html>
