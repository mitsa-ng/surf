# App command surface. Once the app ships an ACL manifest, every custom
# command needs an explicit allow — the chrome UI gets the full set.
[[permission]]
identifier = "allow-surf-commands"
description = "All browser chrome commands (tabs, bookmarks, history, settings, extensions, rules)"
commands.allow = [
    "get_tabs",
    "tab_open",
    "tab_open_incognito",
    "tab_set_pinned",
    "tab_reopen_closed",
    "tab_close",
    "tab_close_others",
    "tab_close_right",
    "tab_activate",
    "tab_navigate",
    "tab_back",
    "tab_forward",
    "tab_reload",
    "tab_stop",
    "deeplink_take",
    "filter_capabilities",
    "extensions_list",
    "extension_install",
    "extension_uninstall",
    "extension_grant",
    "ext_popup_open",
    "bookmarks_list",
    "bookmarks_add",
    "bookmarks_remove",
    "history_recent",
    "history_clear",
    "bookmarks_bar_set_open",
    "split_set",
    "split_clear",
    "downloads_list",
    "download_reveal",
    "find_in_page",
    "settings_get",
    "settings_set",
    "rules_get",
    "rules_set",
    "sync_export",
    "sync_import",
    "sync_auto_get",
    "sync_auto_set",
    "pick_sync_file",
    "panel_set_open",
    "overlay_set_open",
    "agent_panel_set_open",
]
